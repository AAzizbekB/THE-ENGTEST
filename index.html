     index.html
     ========================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ENGTEST — IELTS Hub</title>
  <link rel="stylesheet" href="styles.css"/>
  <meta name="theme-color" content="#0b0b10"/>
</head>
<body>
  <!-- Background layers -->
  <div class="bg">
    <div class="bgNoise"></div>
    <div class="bgGlow bgGlowA"></div>
    <div class="bgGlow bgGlowB"></div>
    <div class="bgGrid"></div>
  </div>

  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sideTop">
        <button class="iconBtn" id="btnSideToggle" title="Collapse sidebar">
          <span class="icon">☰</span>
        </button>

        <div class="brand" id="brand">
          <div class="logoWrap">
            <img class="logoImg" id="logoImg" src="assets/logo.png" alt="ENGTEST" onerror="this.style.display='none'"/>
            <div class="logoFallback" id="logoFallback">E</div>
          </div>
          <div class="brandText">
            <div class="brandTitle">ENGTEST</div>
            <div class="brandSub" id="t_ieltsHub">IELTS Hub</div>
          </div>
        </div>
      </div>

      <nav class="nav">
        <button class="navItem active" data-route="home">
          <span class="navIcon">🏠</span><span class="navLabel" id="t_home">Home</span>
        </button>
        <button class="navItem" data-route="grammar">
          <span class="navIcon">📘</span><span class="navLabel" id="t_grammar">Grammar</span>
        </button>
        <button class="navItem" data-route="vocab">
          <span class="navIcon">📗</span><span class="navLabel" id="t_vocab">Vocab</span>
        </button>
        <button class="navItem" data-route="reading">
          <span class="navIcon">📄</span><span class="navLabel" id="t_reading">Reading</span>
        </button>
        <button class="navItem" data-route="listening">
          <span class="navIcon">🎧</span><span class="navLabel" id="t_listening">Listening</span>
        </button>
        <button class="navItem" data-route="profile">
          <span class="navIcon">👤</span><span class="navLabel" id="t_profile">Profile</span>
        </button>
        <button class="navItem" data-route="settings">
          <span class="navIcon">⚙️</span><span class="navLabel" id="t_settings">Settings</span>
        </button>
      </nav>

      <div class="sideBottom">
        <div class="miniCard">
          <div class="miniRow">
            <div class="miniTitle" id="t_level">Level</div>
            <div class="pill" id="levelPill">1</div>
          </div>
          <div class="progress">
            <div class="progressBar" id="xpBar"></div>
          </div>
          <div class="miniHint" id="xpHint">0 / 100 XP</div>
        </div>

        <div class="miniCard">
          <div class="miniRow">
            <div class="miniTitle" id="t_streak">Streak</div>
            <div class="pill" id="streakPill">0</div>
          </div>
          <div class="miniHint" id="streakHint">Keep going 🔥</div>
        </div>

        <div class="miniFooter" id="t_offlineNote">
          Hammasi brauzeringizda saqlanadi
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="crumb" id="crumb">Home</div>

        <div class="topbarRight">
          <!-- Clock -->
<div class="clockWrap" id="clockWrap" title="Local time">
  <div class="clockTime" id="clockTime">--:--</div>
  <div class="clockDate" id="clockDate">----</div>
</div>
          <!-- Music -->
          <div class="musicWidget" id="musicWidget">
            <button class="iconBtn" id="btnMusic" title="Play / Pause">
              <span class="icon" id="musicIcon">▶</span>
            </button>
            <select class="select" id="musicSelect" title="Background music"></select>
            <input class="slider" id="musicVol" type="range" min="0" max="100" value="35" title="Volume"/>
          </div>

          <!-- Theme toggle -->
          <button class="btn" id="btnTheme">
            <span id="themeIcon">🌙</span>
            <span class="btnLabel" id="t_dark">Dark</span>
          </button>

          <!-- Language -->
          <select class="select" id="langSelect" title="Language">
            <option value="uz">Uzbek</option>
            <option value="ru">Русский</option>
            <option value="kk">Қазақша</option>
            <option value="tj">Тоҷикӣ</option>
          </select>
        </div>
      </header>

      <section class="content" id="view"></section>
    </main>
  </div>

  <!-- Audio element -->
  <audio id="bgAudio" preload="none"></audio>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
