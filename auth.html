<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ENGTEST — Login</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    :root{ --accent:#ff3b47; --accent2:#ff6b73; }
    .authWrap{ min-height:100vh; display:grid; place-items:center; padding:18px; }
    .authCard{
      width:min(520px, 96vw);
      background: rgba(12,12,18,0.62);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 26px;
      padding: 18px;
      box-shadow: 0 18px 55px rgba(0,0,0,0.55);
    }
    .authTop{ display:flex; gap:14px; align-items:center; }
    .authLogo{
      width:62px; height:62px; border-radius:20px; overflow:hidden;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.22);
      display:grid; place-items:center;
    }
    .authLogo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .authTitle{ font-weight:1000; font-size:30px; }
    .authSub{ color: rgba(234,234,242,0.70); margin-top:4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .linkBtn{ border:none; background:none; padding:0; cursor:pointer; color: var(--accent2); font-weight:900; }
    .label{ display:block; margin-top:12px; margin-bottom:6px; color: rgba(234,234,242,0.70); font-size:13px; font-weight:800; }
    .pwWrap{ position:relative; }
    .pwEye{
      position:absolute; right:10px; top:50%; transform:translateY(-50%);
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: rgba(234,234,242,0.90);
      border-radius:12px; padding:7px 9px; cursor:pointer;
    }
    .bigBtn{
      width:100%;
      border:1px solid rgba(255,59,71,0.35);
      background: linear-gradient(135deg, rgba(255,59,71,0.35), rgba(255,255,255,0.06));
      color:#fff; border-radius:18px; padding:14px;
      font-weight:1000; cursor:pointer; transition: transform 220ms ease;
    }
    .bigBtn:hover{ transform: translateY(-1px); }
    .authOr{ display:flex; gap:12px; align-items:center; margin:16px 0; color: rgba(234,234,242,0.55); font-size:12px; }
    .authOr span{ flex:1; height:1px; background: rgba(255,255,255,0.10); }
    .googleBtn{
      width:100%;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: rgba(234,234,242,0.95);
      border-radius:18px; padding:13px 14px; font-weight:900;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
    }
    .gIcon{
      width:26px; height:26px; border-radius:10px;
      background: rgba(0,0,0,0.22);
      display:grid; place-items:center;
      font-weight:1000; border:1px solid rgba(255,255,255,0.12);
    }
    .authFooter{ margin-top:16px; text-align:center; color: rgba(234,234,242,0.55); font-size:12px; }
    .authMsg{ margin-top:12px; color: rgba(234,234,242,0.85); font-size:13px; }
  </style>
</head>
<body>
  <div class="bg">
    <div class="bgNoise"></div>
    <div class="bgGlow bgGlowA"></div>
    <div class="bgGlow bgGlowB"></div>
    <div class="bgGrid"></div>
  </div>

  <div class="authWrap">
    <div class="authCard">
      <div class="authTop">
        <div class="authLogo">
          <img src="assets/logo.png" alt="ENGTEST" onerror="this.style.display='none'">
          <div style="font-weight:1000;">E</div>
        </div>
        <div>
          <div class="authTitle" id="authTitle">Log In</div>
          <div class="authSub">
            <span id="authHint">Don’t have an account?</span>
            <button class="linkBtn" id="toggleMode">Sign up</button>
          </div>
        </div>
      </div>

      <div class="hr"></div>

      <label class="label">Email address</label>
      <input class="input" id="email" placeholder="you@example.com" autocomplete="email"/>

      <div style="height:10px"></div>

      <div class="row" style="justify-content:space-between">
        <label class="label" style="margin:0">Password</label>
        <button class="linkBtn" id="forgotBtn" type="button">Forgot password?</button>
      </div>

      <div class="pwWrap">
        <input class="input" id="password" placeholder="Enter your password" type="password" autocomplete="current-password"/>
        <button class="pwEye" id="pwEye" type="button" title="Show/Hide">👁</button>
      </div>

      <div style="height:14px"></div>

      <button class="bigBtn" id="submitBtn" type="button">Log In</button>

      <div class="authOr">
        <span></span><div>Or continue with</div><span></span>
      </div>

      <button class="googleBtn" id="googleBtn" type="button">
        <span class="gIcon">G</span>
        Continue with Google
      </button>

      <div class="authFooter">
        By continuing, you agree to our Terms and Privacy Policy.
      </div>

      <div class="authMsg" id="msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js?v=123"></script>

  <script>
  alert("BODY START ✅ (auth.html)");
</script>
</body>
</html>
